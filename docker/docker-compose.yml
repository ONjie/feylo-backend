name: feylo_backend
services:
  web:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: feylo_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ../:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      postgres_db:
        condition: service_started
      redis_cache:
        condition: service_healthy
    
  
  postgres_db:
    image: postgres:16-alpine
    container_name: feylo_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - feylo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  
  redis_cache:
    image: redis:7-alpine
    container_name: feylo_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  feylo_postgres:
  redisdata: