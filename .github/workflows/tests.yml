name: Run Tests

on:
  push:
    branches: 
      - dev 
  pull_request:
    branches: 
      - dev

jobs:
  test-suite:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Project Dependencies
        run: uv sync --frozen

      - name: Execute Automated Pytest Suite
        run: |
          uv run pytest ./feylo-backend
